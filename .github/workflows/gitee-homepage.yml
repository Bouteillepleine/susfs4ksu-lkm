name: gitee-homepage

# Keeps the Gitee repository in the shape this project wants it in.  Gitee is NOT a source
# mirror and NOT an artefact channel any more:
#
#   * the source lives on GitHub;
#   * the built .ko files are attached to the GitHub release, and are uploaded to the Gitee
#     release BY HAND - a GitHub runner is overseas and gitee.com is the far end of that
#     link, which measured about 15 KB/s, i.e. tens of minutes per release for no benefit
#     over doing it from a machine that is already in China;
#   * what stays on Gitee is one branch whose only content is a README that says what this
#     repository is: the domestic mirror of the GitHub project's releases.  It also states
#     that no feedback is taken here - no issues, no pull requests, no comments.
#
# Run by hand.  It is a tidy-up tool, not a publishing step: it never uploads anything.
#
# Why the default branch is kept as ONE commit instead of being deleted outright: a Gitee
# release has to hang off a tag, and a tag has to point at a commit that exists in that
# repository.  With the branch reduced to a README-only commit, a tag made off it hands out
# nothing but that README - no source - and later releases can still get their tag created
# by Gitee from target_commitish.  Existing tags are left alone for the same reason: the
# published releases hang off them.
#
# Configuration, once, in this repository's settings (never in this file):
#   secret   GITEE_TOKEN  a Gitee personal access token with the `projects` scope
#   variable GITEE_REPO   owner/name on gitee.com, e.g. "someone/susfs4ksu-lkm"
on:
  workflow_dispatch:

concurrency:
  group: gitee-homepage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_REPO: ${{ vars.GITEE_REPO }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check configuration
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "::error::GITEE_TOKEN is not configured (see this workflow's header)"
            exit 1
          fi
          if [ -z "${GITEE_REPO}" ]; then
            echo "::error::GITEE_REPO is not configured - set it to owner/name on gitee.com"
            exit 1
          fi

      - name: Point the Gitee repository at GitHub
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/${GITEE_REPO}"
          owner="${GITEE_REPO%%/*}"
          url="https://github.com/${GH_REPO}"

          echo "--- branches before ---"
          curl -sf "${api}/branches?access_token=${GITEE_TOKEN}" | jq -r '.[].name' || true

          work=$(mktemp -d)
          cd "$work"
          git init -q .
          git config user.name "gitee-homepage"
          git config user.email "gitee-homepage@users.noreply.github.com"

          # Built with printf rather than a heredoc on purpose: a heredoc inside this block
          # scalar would carry the YAML indentation into the file, which turns the whole
          # README into an indented code block on the far side.
          {
            echo '# susfs_guard_lkm — GitHub release 的国内镜像'
            echo
            echo "本仓库是 [inforcqb/susfs4ksu-lkm](${url}) 的 **release 国内镜像**。"
            echo '每个版本的构建产物 —— 各内核变体的 `.ko` 与加载器 `susfs_insmod` ——'
            echo '以 Release 附件的形式发布在这里；源码、文档与开发都在 GitHub 仓库。'
            echo
            echo '**本仓库不接受任何反馈**：不处理 issue、不接受 PR、不回复评论。'
            echo '问题、建议或 bug，请到 GitHub 仓库提交。'
          } > README.md

          git add README.md
          git commit -q -m "gitee: domestic release mirror of the GitHub project, no feedback here"
          git push -q --force "https://${owner}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" HEAD:refs/heads/main

          # Every other branch goes: the mirror is gone, and the default branch stays only
          # because a tag needs a commit that exists here (see this workflow's header).
          refs=""
          while read -r b; do
            if [ -z "$b" ] || [ "$b" = "main" ]; then continue; fi
            refs="${refs} refs/heads/${b}"
          done <<EOF2
          $(curl -sf "${api}/branches?access_token=${GITEE_TOKEN}" | jq -r '.[].name')
          EOF2
          if [ -n "${refs}" ]; then
            # shellcheck disable=SC2086
            git push -q "https://${owner}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" --delete ${refs}
            echo "deleted:${refs}"
          else
            echo "no branches to delete"
          fi

          echo "--- branches after ---"
          curl -sf "${api}/branches?access_token=${GITEE_TOKEN}" | jq -r '.[].name'
          echo "--- what the Gitee default branch contains ---"
          curl -sf "${api}/contents/README.md?access_token=${GITEE_TOKEN}" | jq -r '.name, .size' || true
